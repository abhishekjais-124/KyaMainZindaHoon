{% load static %}

    <svg class="page-loader__spinner" width="52" height="52" viewBox="0 0 52 52">
      <circle class="page-loader__track" cx="26" cy="26" r="21" fill="none" stroke-width="2" />

    </svg>
    <span class="page-loader__pulse"></span>
    <span class="page-loader__label">Loading</span>
